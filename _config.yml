title: R&D Innovate
description: Daily signal from the cutting edge of research and development.
url: "https://blog.rdinnovate.com"
baseurl: ""
permalink: /:year/:month/:day/:title/
markdown: kramdown

# Scheduling: posts dated in the future stay hidden until the daily
# rebuild (GitHub Actions cron) runs on or after their date.
future: false
timezone: Australia/Sydney

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - _linkedin
  - _source
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github

# ── RnD Tax Workbench download page ─────────────────────
workbench:
  version: "1.1.0"
  repo: "RDInnovateRD/rnd-tax-workbench"   # change if hosted elsewhere
  signed_mac: true      # notarised, Gatekeeper accepts
  signed_win: false     # flip once the OV cert is applied
  mac_arm: "RnD-Tax-Workbench-1.1.0-mac-arm64.dmg"
  mac_x64: "RnD-Tax-Workbench-1.1.0-mac-x64.dmg"
  windows: "RnD-Tax-Workbench-1.1.0-win-x64.exe"          # fill in when the Windows build is signed
  linux: ""            # fill in when the Linux build exists
