---
layout: default
---
<article class="post">
  <p class="eyebrow"><a href="{{ '/' | relative_url }}">&larr; All articles</a></p>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
<nav class="pagenav">
  {%- if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title | truncate: 46 }}</a>{% endif -%}
  {%- if page.next %}<a class="r" href="{{ page.next.url | relative_url }}">{{ page.next.title | truncate: 46 }} &rarr;</a>{% endif -%}
</nav>
